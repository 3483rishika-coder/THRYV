services:
  - type: web
    name: thryv
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m thryv serve
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: THRYV_HOST
        value: 0.0.0.0
      - key: THRYV_DB
        value: /tmp/thryv.db
      - key: THRYV_ARTIFACTS
        value: /tmp/artifacts
      - key: THRYV_PASSWORD
        sync: false